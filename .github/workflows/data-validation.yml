name: Validate historical data and simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV data
        run: python scripts/validate_data.py
      - name: Run economy prototype tests
        run: python -m unittest discover -s tests -v
      - name: Render economy prototype report
        run: python prototype/economy.py
