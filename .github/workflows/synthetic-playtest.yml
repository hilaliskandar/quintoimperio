name: Synthetic MVP playtest

on:
  push:
    branches:
      - experiment/synthetic-playtest-20
    paths:
      - "tools/simulate_synthetic_player.py"
      - "tools/aggregate_synthetic_playtest.py"
      - ".github/workflows/synthetic-playtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    name: player-${{ matrix.id }}-${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: 1, profile: DISCIPLINED, seed: 101}
          - {id: 2, profile: DISCIPLINED, seed: 102}
          - {id: 3, profile: DISCIPLINED, seed: 103}
          - {id: 4, profile: DISCIPLINED, seed: 104}
          - {id: 5, profile: CAUTIOUS, seed: 201}
          - {id: 6, profile: CAUTIOUS, seed: 202}
          - {id: 7, profile: CAUTIOUS, seed: 203}
          - {id: 8, profile: CAUTIOUS, seed: 204}
          - {id: 9, profile: IMPATIENT, seed: 301}
          - {id: 10, profile: IMPATIENT, seed: 302}
          - {id: 11, profile: IMPATIENT, seed: 303}
          - {id: 12, profile: IMPATIENT, seed: 304}
          - {id: 13, profile: FRUGAL, seed: 401}
          - {id: 14, profile: FRUGAL, seed: 402}
          - {id: 15, profile: FRUGAL, seed: 403}
          - {id: 16, profile: FRUGAL, seed: 404}
          - {id: 17, profile: TRADER, seed: 501}
          - {id: 18, profile: TRADER, seed: 502}
          - {id: 19, profile: TRADER, seed: 503}
          - {id: 20, profile: TRADER, seed: 504}
    steps:
      - name: Checkout clean copy
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloaded project
        run: python -m pip install -e .
      - name: Run independent synthetic player
        run: |
          mkdir -p build/synthetic
          python tools/simulate_synthetic_player.py \
            --player-id "${{ matrix.id }}" \
            --profile "${{ matrix.profile }}" \
            --seed "${{ matrix.seed }}" \
            --output "build/synthetic/player-${{ matrix.id }}.json"
      - name: Upload player metrics
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-player-${{ matrix.id }}
          path: build/synthetic/player-${{ matrix.id }}.json
          if-no-files-found: error

  aggregate:
    name: aggregate-20-players
    needs: play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all player metrics
        uses: actions/download-artifact@v4
        with:
          pattern: synthetic-player-*
          path: build/synthetic-results
          merge-multiple: true
      - name: Aggregate metrics
        run: |
          python tools/aggregate_synthetic_playtest.py \
            --input-dir build/synthetic-results \
            --csv build/synthetic-playtest-20.csv \
            --summary build/synthetic-playtest-summary.json
      - name: Upload consolidated metrics
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-playtest-20-results
          path: |
            build/synthetic-playtest-20.csv
            build/synthetic-playtest-summary.json
          if-no-files-found: error
