name: Structural strain campaign diagnostic v0.6

on:
  push:
    branches:
      - diag/structural-strain-campaign-v06
    paths:
      - "tools/diagnose_structural_strain_campaign.py"
      - ".github/workflows/structural-strain-campaign-v06.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run paired campaign diagnostic
        run: |
          mkdir -p build/structural-strain-campaign-v06
          python tools/diagnose_structural_strain_campaign.py \
            --seed-start 30001 \
            --seed-count 1000 \
            --csv build/structural-strain-campaign-v06/events.csv \
            --summary build/structural-strain-campaign-v06/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-strain-campaign-v06
          path: build/structural-strain-campaign-v06/*
